name: Fork Client Release

# Unsigned client builds for every desktop platform, published to THIS fork's
# Releases page (sjennings/orca) so people can download them directly.
#
# Why it exists: the upstream release pipeline cannot run on the fork — the mac
# dev-channel workflows publish to stablyai/orca-* repos and release-cut signs
# with credentials that live upstream. This reuses the same build recipe
# (pnpm build:release + electron-builder per platform, as release-cut and the
# dev-channel workflows do) but ships unsigned artifacts:
#
#   - macOS: dmg + zip, x64 + arm64, ad-hoc signed only (no Developer ID cert,
#     no notarization — the local-build path from
#     BUILD_MACOS_CLIENT_FROM_UPSTREAM.md, in CI). First launch needs
#     right-click → Open; in-app updates between fork builds are not guaranteed
#     without a stable signing identity, so plan to download the dmg.
#   - Windows: NSIS setup exe, unsigned via the dev-channel packaging identity
#     (ORCA_WIN_ADHOC=1) so the updater's publisherName is omitted and
#     fork → fork in-app updates work. SmartScreen warns on first install.
#   - Linux: AppImage + deb + rpm, x64 and arm64.
#
# The packaged app-update.yml points at this repo via ORCA_PUBLISH_OWNER /
# ORCA_PUBLISH_REPO (config/electron-builder.config.cjs), so the in-app updater
# checks this repo's releases and never upstream's.
#
# Dispatch-only by design: with no tag trigger, electron-builder's on-tag
# auto-publish can never fire from a stale config. Each leg packages with
# ORCA_PUBLISH_OWNER/REPO pointed at this repo and --publish always, so
# electron-builder uploads its artifacts AND updater manifests into the
# pre-created draft — the manifests are not generated at all under
# --publish never; the publish job then verifies and flips it live.
#
#   gh workflow run fork-client-release.yml --ref main

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-client-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    if: github.repository == 'sjennings/orca'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      sha: ${{ steps.identity.outputs.sha }}
    steps:
      - name: Checkout for package.json
        uses: actions/checkout@v6
        with:
          # This job only reads the version and creates the draft via gh env
          # token; it never pushes (zizmor: artipacked).
          persist-credentials: false

      - name: Compute the release identity
        id: identity
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          pkg="$(jq -r .version package.json)"
          version="${pkg}-fork.$(date -u +%Y%m%d%H%M%S)"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "tag=v$version" >>"$GITHUB_OUTPUT"
          echo "sha=$SHA" >>"$GITHUB_OUTPUT"
          echo "Releasing $version from $SHA"

      # Why draft: everything until the publish job flips it live is a window
      # where the release exists but may lack installable assets. A draft stays
      # off the releases list, so a leg dying mid-run leaves nothing visible
      # rather than a tag the download button 404s on.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.identity.outputs.tag }}
          VERSION: ${{ steps.identity.outputs.version }}
          SHA: ${{ steps.identity.outputs.sha }}
          # Via env, not inline `${{ }}`: template expansion happens before the
          # shell parses the line (zizmor: template-injection).
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          short_sha="${SHA:0:12}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "Orca $VERSION (fork build)" \
            --draft \
            --notes "Fork build of [\`stablyai/orca@$short_sha\`](https://github.com/stablyai/orca/commit/$SHA) carried on \`sjennings/orca\`, cut by @$ACTOR.

          **All artifacts are unsigned.**

          - **macOS** (\`orca-macos-*.dmg\`, Intel + Apple silicon): ad-hoc signed
            only. Right-click → Open on first launch. In-app updates between fork
            builds are not guaranteed without a Developer ID signature — download
            the new dmg when an update is offered but refuses to install.
          - **Windows** (\`orca-windows-setup.exe\`): unsigned, so SmartScreen warns
            on first install. The updater's publisher check is omitted, so
            fork → fork in-app updates work once one build is installed.
          - **Linux**: AppImage, deb, and rpm for x64 and arm64.

          The packaged updater checks this repo's releases, never upstream's."

  build:
    needs: version
    if: github.repository == 'sjennings/orca'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Why macos-15 and not -latest: the native helper builds
          # (build:computer-macos etc.) are proven on the macOS 15 image family
          # the upstream mac legs use.
          - os: macos-15
            platform: mac
            eb_cache_path: |
              ~/Library/Caches/electron
              ~/Library/Caches/electron-builder
          # Why windows-2022 and not windows-latest: windows-latest moved to the
          # Windows 2025 / VS 2026 image before node-gyp could detect VS 18,
          # breaking native dependency install. Same pin as release-cut.
          - os: windows-2022
            platform: win
            eb_cache_path: |
              ~\AppData\Local\electron\Cache
              ~\AppData\Local\electron-builder\Cache
          - os: ubuntu-latest
            platform: linux-x64
            eb_cache_path: |
              ~/.cache/electron
              ~/.cache/electron-builder
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            eb_cache_path: |
              ~/.cache/electron
              ~/.cache/electron-builder

    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      SHA: ${{ needs.version.outputs.sha }}

    steps:
      - name: Checkout the built commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.sha }}
          # Uploads go through the gh env token below; nothing pushes from here
          # (zizmor: artipacked).
          persist-credentials: false

      # pnpm must be on PATH before setup-node so setup-node can locate the store.
      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      # Why: release builds hit the same native-module postinstall path as PR
      # CI; only Linux runners have reproduced the bundled-node-gyp failure, so
      # the override stays scoped to Linux. Same as release-cut.
      - name: Use external node-gyp to avoid pnpm's bundled copy (Linux only)
        if: runner.os == 'Linux'
        run: |
          npm install -g node-gyp@11.5.0
          echo "npm_config_node_gyp=$(npm root -g)/node-gyp/bin/node-gyp.js" >> "$GITHUB_ENV"

      - name: Cache electron-builder downloads
        uses: actions/cache@v5
        with:
          path: ${{ matrix.eb_cache_path }}
          key: electron-builder-fork-${{ matrix.platform }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-fork-${{ matrix.platform }}-

      # Why retried: pnpm install triggers electron's postinstall, which pulls
      # the Electron binary from GitHub release assets, and that CDN returns
      # transient 504s often enough to lose a build to it.
      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile

      # Why: build:release verifies the Linux computer-use provider by importing
      # AT-SPI bindings, absent on stock GitHub Ubuntu runners; rpm is needed by
      # electron-builder's fpm backend. Same as release-cut.
      - name: Install Linux computer-use provider dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-atspi-2.0 at-spi2-core xclip xdotool rpm

      # Why here and not in build: only a Windows runner can compile it, and
      # arm64 cross-compiles from this same x64 agent. Same as the dev-channel
      # Windows leg, including the requirement env in the build step below.
      - name: Build Windows process-table addon for the relay
        if: matrix.platform == 'win'
        shell: bash
        run: |
          node config/scripts/build-windows-process-tree-relay-addon.mjs --arch=x64
          node config/scripts/build-windows-process-tree-relay-addon.mjs --arch=arm64

      - name: Build app
        run: pnpm build:release
        env:
          # Dev-channel parity: leave ORCA_BUILD_IDENTITY unset (telemetry's
          # transport gate accepts only stable/rc) and pin the diagnostics URL,
          # keeping these unvetted builds silent.
          ORCA_DIAGNOSTICS_TOKEN_URL: https://www.onorca.dev/diagnostics/token
          ORCA_REQUIRE_RELAY_NATIVE_ADDONS: ${{ matrix.platform == 'win' && 'x64,arm64' || '' }}

      # Per-platform packaging identity, mirroring the upstream legs:
      #   mac: local-build identity — no channel env, so hardened runtime,
      #     notarization, and forceCodeSigning stay off and ad-hoc signing is
      #     allowed without certs.
      #   win: ORCA_WIN_ADHOC=1 dev-channel identity — drops the updater
      #     publisherName so unsigned → unsigned updates verify.
      #   linux: host-arch packaging; arm64 needs ORCA_LINUX_ARM64_RELEASE=1.
      - name: Package
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          GH_TOKEN: ${{ github.token }}
          # Why: a slow leg can cross electron-builder's release-freshness
          # window; same escape hatch the dev-channel workflows pass.
          EP_GH_IGNORE_TIME: 'true'
        run: |
          set -euo pipefail
          export ORCA_BUILD_COMMIT="$SHA"
          # Why: app-update.yml bakes the publish target in, so fork builds must
          # check THIS repo's releases for updates, never upstream's.
          export ORCA_PUBLISH_OWNER="${GITHUB_REPOSITORY%%/*}" ORCA_PUBLISH_REPO="${GITHUB_REPOSITORY##*/}"
          # Why the guard: electron-builder's publisher infers the tag from the
          # packaged version and CREATES a public release when no draft by that
          # name exists. Fail here rather than ship a half-asseted release.
          draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          if [[ "$draft" != "true" ]]; then
            echo "::error::Draft $TAG not found in $GITHUB_REPOSITORY; refusing to package so the publisher cannot create its own release."
            exit 1
          fi
          # Why the stamp on every leg: the publisher infers the release tag
          # from the packaged version — an unstamped leg resolves v<package
          # version>, misses the draft, and publishes rogue (seen live).
          export ORCA_LOCAL_BUILD_VERSION="$VERSION"
          case "$PLATFORM" in
            win)
              # Dev-channel identity: drops the updater publisherName so
              # unsigned fork-to-fork updates verify. ORCA_ADHOC_BUILD_VERSION
              # wins over ORCA_LOCAL_BUILD_VERSION in the packaging config.
              export ORCA_WIN_ADHOC=1 ORCA_ADHOC_BUILD_VERSION="$VERSION"
              ;;
          esac
          node config/scripts/ensure-native-runtime.mjs --runtime=electron
          case "$PLATFORM" in
            mac)
              args=(--mac) ;;
            win)
              args=(--win) ;;
            linux-x64)
              args=(--linux AppImage deb rpm --x64) ;;
            linux-arm64)
              export ORCA_LINUX_ARM64_RELEASE=1
              args=(--linux AppImage deb rpm --arm64) ;;
          esac
          # Why --publish always and not never: the updater manifests
          # (latest*.yml) are only generated on the publish path. The publisher
          # target is this repo's pre-created draft via ORCA_PUBLISH_* above.
          pnpm exec electron-builder --config config/electron-builder.config.cjs "${args[@]}" --publish always

  publish:
    needs: [version, build]
    if: always() && github.repository == 'sjennings/orca'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # Why delete and not keep: a draft left behind by a failed leg is invisible
      # to users but still holds its tag name, blocking the next dispatch from
      # reusing it. No --cleanup-tag: a draft never created the git tag.
      - name: Discard the draft release when a build leg failed
        if: needs.version.outputs.tag != '' && needs.build.result != 'success'
        run: |
          set -uo pipefail
          echo "Build legs ended as '${{ needs.build.result }}'; discarding draft $TAG"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes ||
            echo "::warning::Could not discard draft $TAG; remove it manually."

      # Why check manifests: the updater resolves the tag, then fetches
      # latest*.yml from it. A release carrying installers but not the manifest
      # is one the picker offers and the update 404s on.
      - name: Verify assets and publish the release
        if: needs.build.result == 'success'
        run: |
          set -euo pipefail
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          echo "Assets on $TAG:"
          echo "$assets"
          for required in \
            latest-mac.yml \
            latest.yml \
            latest-linux.yml \
            latest-linux-arm64.yml \
            orca-windows-setup.exe \
            orca-macos-x64.dmg \
            orca-macos-arm64.dmg; do
            grep -qx "$required" <<<"$assets" || {
              echo "::error::$TAG is missing $required; refusing to publish an incomplete release."
              exit 1
            }
          done
          for pattern in 'AppImage$' '\.deb$' '\.rpm$' '\.zip$'; do
            grep -q "$pattern" <<<"$assets" || {
              echo "::error::$TAG has no asset matching /$pattern/."
              exit 1
            }
          done
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest \
            --title "Orca $VERSION (fork build)"
          echo "Published $TAG"
